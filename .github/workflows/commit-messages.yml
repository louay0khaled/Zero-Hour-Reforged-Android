name: Commit messages

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize diagnostic logs
        shell: bash
        run: |
          mkdir -p artifacts/ci-logs
          {
            echo "Workflow: ${GITHUB_WORKFLOW}"
            echo "Run ID: ${GITHUB_RUN_ID}"
            echo "Run attempt: ${GITHUB_RUN_ATTEMPT}"
            echo "Commit: ${GITHUB_SHA}"
            echo "Started UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git --version
          } | tee artifacts/ci-logs/run-metadata.txt

      - name: Every commit reads type(scope) summary
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          {
          pattern='^((feat|fix|perf|build|refactor|test|ci)\([a-z0-9._-]+\)|docs(\([a-z0-9._-]+\))?): [^ ]'
          status=0
          while IFS= read -r line; do
            sha=${line%% *}
            subject=${line#* }
            # Exempt exact pre-existing bootstrap commits rather than rewriting published history.
            legacy_allowlist=' a8fdfe66 b5bd4cec 71959d9d 913aca1e 5203b23e fd32f989 c4d09764 15461737 '
            if [[ "$legacy_allowlist" == *" $sha "* ]]; then
              echo "::notice::$sha is a pre-existing Android bootstrap commit; legacy message exempted."
              continue
            fi
            if ! printf '%s' "$subject" | grep -Eq "$pattern"; then
              echo "::error::$sha \"$subject\" should read type(scope): summary, with a type of feat, fix, perf, build, refactor, test, ci or docs. See CONTRIBUTING.md."
              status=1
            elif [ ${#subject} -gt 72 ]; then
              echo "::error::$sha \"$subject\" is ${#subject} characters; keep the first line under 72."
              status=1
            fi
          done < <(git log --no-merges --format='%h %s' "$BASE..$HEAD")
          while IFS= read -r line; do
            echo "::error::${line%% *} is a merge commit. Rebase the branch onto main instead of merging main into it. See CONTRIBUTING.md."
            status=1
          done < <(git log --merges --format='%h %s' "$BASE..$HEAD")
          exit $status
          } 2>&1 | tee artifacts/ci-logs/commit-message-check.log

      - name: Write diagnostic summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Commit message workflow diagnostics"
            echo
            echo "- Commit: $GITHUB_SHA"
            echo "- Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- Attempt: $GITHUB_RUN_ATTEMPT"
            echo "- Full validation output is in the diagnostic artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload workflow logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commit-message-ci-logs-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: artifacts/ci-logs/
          if-no-files-found: warn
          retention-days: 30
